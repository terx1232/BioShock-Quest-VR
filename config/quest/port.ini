; Настройки порта BioShock -> Meta Quest 2 (WinlatorXR).
; Поменяйте значение и запустите BUILD.bat ещё раз.

[game]
; auto = скрипт сам ищет игру (Steam-библиотеки, реестр, все диски)
path = auto

[port]
; Название приложения в шлеме
app_name = BioShock VR
; Имя папки-кеша. Её нужно положить в КОРЕНЬ памяти шлема, приложение ищет её по этому имени.
cache_name = BioshockMQ2
; Увеличьте, чтобы шлем заново применил настройки контейнера и ярлыка
version = 86

[display]
; Частота шлема: 72, 90 или 120 (на Quest 2 120 Гц экспериментальная)
refresh_rate = 72
; Рабочее окно меню 16:9; у уровня отдельный размер из native_ini.
resolution = 1280x720
; Пространство Winlator для игрового окна; меню остаётся в resolution.
desktop_resolution = 1728x864

[graphics]
; maxfps   - всё тяжёлое выключено, максимум кадров (рекомендуется для Quest 2)
; balanced - шейдеры и постобработка оставлены, тени/отражения/искажения выключены
; original - графика не трогается, меняются только разрешение, частота и управление
preset = maxfps
; Пропуск заставки 2K при запуске
skip_intro = yes

[vr]
; mod     - настоящий VR-мод: камера следует за головой (6DoF), геймпад из контроллеров,
;           меню и загрузки - плоский экран с лазерным указателем (рекомендуется)
; reshade - старый вариант: иммерсивный экран + стерео-шейдер ReShade
; flat    - без VR, плоский экран
mode = mod
; Стерео в VR-моде (глаза по очереди, каждому половина FPS). no = моно, плавнее
mod_stereo = no
native_dll = auto
native_ini = config/quest/profiles/candidate.ini
; Поворот правым стиком рывками (меньше укачивает) или плавно
snap_turn = yes
; Скорость плавного поворота, градусов в секунду
turn_speed = 120
; --- настройки режима reshade ---
; Иммерсивный режим: картинка вокруг вас, поворот головы = обзор (3DoF)
immersive = yes
; Стерео 3D (настоящая глубина для каждого глаза) через ReShade и шейдер BioshockVR.fx
stereo = yes
; Сила стерео-эффекта (0.010 - слабо, 0.025 - норма, 0.040 - сильно)
stereo_strength = 0.025
; Глубина плоскости экрана (ближе неё предметы "выходят" из экрана)
screen_depth = 0.015

[input]
; gamepad - контроллеры Quest работают как геймпад Xbox, голова тоже поворачивает камеру
; mouse   - голова = мышь 1:1 (самый "VR" обзор), кнопки = клавиатура WinlatorXR
controls = mouse

[tools]
; auto = искать в папке tools\ и в Загрузках. Можно указать полный путь.
winlator_apk = auto
apktool = auto
; ReShade32.dll (32-битная). auto = взять из APK WinlatorXR или скачать с reshade.me
reshade_dll = auto
; Steamless.CLI.exe - снимает SteamStub со своей копии игры (без Steam игра иначе не запустится)
steamless = auto

[performance]
; Сравнить камеру и Present без очереди движка; placed-mapping fix 47 сохранён.
render_threading = no
; Wine WoW64 должен сам выбирать адрес Vulkan-буферов ниже 4 ГиБ.
; В 46 обычный MapMemory вернул 64-битный адрес перед аварийным выходом.
vulkan_placed = yes
; Уменьшает параллельный расход памяти компилятора Vulkan.
dxvk_compiler_threads = 2
; Бюджет, который DXVK сообщает игре, в МиБ; это не жёсткий лимит RAM.
dxvk_reported_memory = 512
; Версия DXVK (DirectX -> Vulkan) из WinlatorXR. 2.6.2-binsem-gplasync намного быстрее старой 1.10.1
dxvk = 2.6.2-binsem-gplasync
; yes = тайловый рендер видеочипа Adreno (быстрее). no = рисовать в общей памяти (sysmem), если будут артефакты
gpu_tiling = yes
; Кеш скомпилированного эмулятором кода: быстрее загрузки и меньше рывков
fex_cache = yes

[diagnostics]
; Временный журнал причины вылета. После диагностики вернуть оба значения в no.
wine_debug = yes
; Без process: NtQueryInformationProcess вызывается каждый кадр и засоряет вывод.
wine_debug_channels = timestamp,pid,tid,seh
dxvk_debug = yes

[install]
; yes = сразу поставить APK и залить папку в шлем по USB (adb), no = только собрать, ask = спросить
adb_install = no
; Отладочная сборка: позволяет читать файлы контейнера через adb (run-as). Для обычной игры - no
debuggable = yes
